name: speech-provider-piper-voices-pt-br
summary: Piper voices content snap (pt_BR)
description: |
  Content snap that provides the Piper pt_BR voice model files.
version: '0.1'
grade: devel
confinement: strict
base: core26

slots:
  piper-voices:
    interface: content
    content: piper-voices
    source:
      read:
        - /

parts:
  voices-pt-br-cadu-medium:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
    override-build: |
      set -eu
      curl -L --fail --retry 3 \
        -o "$CRAFT_PART_INSTALL/pt_BR-cadu-medium.onnx" \
        "https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/cadu/medium/pt_BR-cadu-medium.onnx"
      curl -L --fail --retry 3 \
        -o "$CRAFT_PART_INSTALL/pt_BR-cadu-medium.onnx.json" \
        "https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/cadu/medium/pt_BR-cadu-medium.onnx.json"

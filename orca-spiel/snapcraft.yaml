name: orca-spiel
base: core26
description: |
  Orca is a free, open source, flexible, and extensible screen reader that
  provides access to the graphical desktop via user-customizable combinations
  of speech and/or braille.

  Orca works with applications and toolkits that support the Assistive
  Technology Service Provider Interface (AT-SPI), which is the primary
  assistive technology infrastructure for free and open desktops.
summary: Orca screen reader with Spiel speech provider
version: '50.2-dev'
grade: devel
confinement: devmode

plugs:
  speech-provider-piper:
    interface: dbus
    bus: session
    name: ai.piper.Speech.Provider
  speech-provider-espeak:
    interface: dbus
    bus: session
    name: org.espeak.Speech.Provider

apps:
  orca:
    command: bin/orca-launch
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET/:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET/pulseaudio:$LD_LIBRARY_PATH
      PULSE_SERVER: unix:$XDG_RUNTIME_DIR/../pulse/native
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages
      XDG_DATA_DIRS: $SNAP/usr/share:$XDG_DATA_DIRS
      GSETTINGS_SCHEMA_DIR: $SNAP/usr/share/glib-2.0/schemas
      GI_TYPELIB_PATH: $SNAP/usr/lib/x86_64-linux-gnu/girepository-1.0:$SNAP/usr/lib/girepository-1.0
      GST_PLUGIN_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET/gstreamer-1.0
      GST_PLUGIN_SYSTEM_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET/gstreamer-1.0
    plugs:
      - audio-playback
      - pulseaudio
      - speech-provider-piper
      - speech-provider-espeak
  spiel:
    command: usr/bin/spiel
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET/:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET/pulseaudio:$LD_LIBRARY_PATH
      PULSE_SERVER: unix:$XDG_RUNTIME_DIR/../pulse/native
      XDG_DATA_DIRS: $SNAP/usr/share:$XDG_DATA_DIRS
      GSETTINGS_SCHEMA_DIR: $SNAP/usr/share/glib-2.0/schemas
      GST_PLUGIN_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET/gstreamer-1.0
      GST_PLUGIN_SYSTEM_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET/gstreamer-1.0
    plugs:
      - audio-playback
      - pulseaudio
      - speech-provider-piper
      - speech-provider-espeak

parts:
  orca-launcher:
    plugin: nil
    override-build: |
      install -d "$CRAFT_PART_INSTALL/bin"
      cat > "$CRAFT_PART_INSTALL/bin/orca-launch" << 'EOF'
      #!/bin/sh
      exec "$SNAP/usr/bin/python3" "$SNAP/usr/bin/orca" "$@"
      EOF
      chmod 0755 "$CRAFT_PART_INSTALL/bin/orca-launch"

  orca:
    plugin: meson
    source: https://gitlab.gnome.org/GNOME/orca.git
    source-type: git
    #source-tag: 50.2
    source-depth: 0
    build-packages:
      - at-spi2-core
      - cmake
      - gettext
      - gi-docgen
      - cargo
      - meson
      - ninja-build
      - libatk-bridge2.0-dev
      - libatspi2.0-dev
      - libgirepository1.0-dev
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
      - libglib2.0-bin
      - libgtk-3-dev
      - pkg-config
      - python3-babel
      - python3-dasbus
      - python3-dbusmock
      - python3-gi
      - python3-gi-cairo
      - python-gi-dev
      - yelp-tools
    stage-packages:
      - at-spi2-core
      - dconf-gsettings-backend
      - gir1.2-atk-1.0
      - gir1.2-atspi-2.0
      - gir1.2-gdkpixbuf-2.0
      - gir1.2-gtk-3.0
      - gir1.2-wnck-3.0
      - gsettings-desktop-schemas
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-pulseaudio
      - libatk-bridge2.0-0
      - libatspi2.0-0
      - libgirepository-1.0-1
      - libgstreamer1.0-0
      - libgstreamer-plugins-base1.0-0
      - libgtk-3-0
      - python3
      - python3-dasbus
      - python3-dbusmock
      - python3-gi
      - python3-gi-cairo
      - x11-xkb-utils
    override-build: |
      craftctl default
      sed -i '1s|^#!/.*python3$|#!/usr/bin/python3|' "$CRAFT_PART_INSTALL/usr/bin/orca"
    override-prime: |
      craftctl default
      if [ -d "$CRAFT_PRIME/usr/share/glib-2.0/schemas" ]; then
        glib-compile-schemas "$CRAFT_PRIME/usr/share/glib-2.0/schemas"
      fi
    meson-parameters:
      - --reconfigure
      - --prefix=/usr
      - --force-fallback-for=spiel
      - -Dspiel=true 

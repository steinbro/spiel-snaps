name: spiel-it
version: '0.1'
summary: A demo app using the Spiel text-to-speech API
description: |
  Spiel It! is a demo application for the Spiel text-to-speech framework.
  It allows you to test and explore speech synthesis voices available on
  your system via the Spiel API.
grade: devel
confinement: devmode
base: core24

plugs:
  speech-provider:
    interface: dbus
    bus: session
    name: org.espeak.Speech.Provider

apps:
  spiel-it:
    command: bin/run-spiel-it
    extensions: [gnome]
    plugs:
      - audio-playback
      - speech-provider

parts:
  spiel-it:
    plugin: meson
    source: https://github.com/project-spiel/spiel-it.git
    source-type: git
    override-prime: |
      craftctl default
      # Custom launcher script to set PYTHONPATH and run the app with the correct Python interpreter
      mkdir -p "$CRAFT_PRIME/bin"
      cat > "$CRAFT_PRIME/bin/run-spiel-it" <<'EOF'
      #!/bin/sh
      export PYTHONPATH="$SNAP/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}"
      exec "$SNAP/gnome-platform/usr/bin/python3.12" "$SNAP/usr/bin/spiel-it"
      EOF
      chmod +x "$CRAFT_PRIME/bin/run-spiel-it"
    override-build: |
      # Patch the source code to use the correct path for the app data directory in the snap environment
      sed -i "/^import sys$/a import os" $CRAFT_PART_SRC/spiel-it.py.in
      sed -i \
        "s|app = SpielItApp('@app_data_dir@')|app = SpielItApp(os.path.join(os.environ['SNAP'], '@app_data_dir@'.lstrip('/')))|" \
        $CRAFT_PART_SRC/spiel-it.py.in
      craftctl default
    meson-parameters:
      - --prefix=/usr
      - -Dlibspiel:tests=false
      - -Dlibspiel:docs=false
      - -Dc_args=-Wno-error=redundant-decls
    build-packages:
      - python3-dbusmock
      - python3-gi
      - python3-gi-cairo
      - python3-tap
      - libgirepository1.0-dev

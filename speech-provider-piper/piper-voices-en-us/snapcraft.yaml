name: piper-voices-en-us
summary: Piper voices content snap (en_US)
description: |
  Content snap that provides the Piper en_US voice model files.
version: '0.1'
grade: devel
confinement: strict
base: core26

slots:
  piper-voices:
    interface: content
    content: piper-voices
    source:
      read:
        - /en-US.amy-medium

parts:
  voices-en-us-amy-medium:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
    override-build: |
      set -eu
      mkdir -p "$CRAFT_PART_INSTALL/en-US.amy-medium"
      curl -L --fail --retry 3 \
        -o "$CRAFT_PART_INSTALL/en-US.amy-medium/en_US-amy-medium.onnx" \
        "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx"
      curl -L --fail --retry 3 \
        -o "$CRAFT_PART_INSTALL/en-US.amy-medium/en_US-amy-medium.onnx.json" \
        "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx.json"
